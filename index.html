<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miku Study Guardian 3D</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.2.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@400;700&display=swap');

        :root {
            --teal: #39C5BB;
            --teal-dark: #2a9d8f;
            --teal-glow: rgba(57,197,187,0.4);
            --pink: #ff0066;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Fully transparent — Electron window shows through */
        html, body {
            background: transparent !important;
            background-color: transparent !important;
            color: #e0f7f6;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        /* Hide the web dashboard — Electron-only mode */
        .page-wrap, header, .main-layout {
            display: none !important;
        }

        /* ═══════════════════════════════
           MIKU — centered, slides up
           ═══════════════════════════════ */
        .miku-fixed {
            position: fixed;
            bottom: -550px;         /* hidden below viewport */
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 320px;
            filter: drop-shadow(0 0 16px rgba(57,197,187,0.55));
            transition: bottom 0.6s cubic-bezier(0.34, 1.46, 0.64, 1),
                        filter 0.5s ease;
        }

        .miku-fixed.risen {
            bottom: 0px;
            filter: drop-shadow(0 0 28px rgba(255,0,102,0.85))
                    drop-shadow(0 0 18px rgba(57,197,187,0.9));
        }

        /* Floating bob animation */
        .miku-3d-wrap {
            width: 320px;
            height: 480px;
            animation: mikuFloat 3.5s ease-in-out infinite;
        }
        @keyframes mikuFloat {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }

        /* ═══════════════════════════════
           SPEECH BUBBLE above Miku
           ═══════════════════════════════ */
        .miku-bubble {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%) scale(0.7) translateY(10px);
            background: white;
            color: #222;
            padding: 12px 16px;
            border-radius: 16px;
            border: 2.5px solid var(--teal);
            width: 240px;
            font-size: 0.85em;
            line-height: 1.45;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 16px var(--teal-glow);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 1001;
        }
        /* Tail pointing down toward Miku */
        .miku-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            margin-left: -8px;
            width: 16px; height: 16px;
            background: white;
            border-right: 2.5px solid var(--teal);
            border-bottom: 2.5px solid var(--teal);
            transform: rotate(45deg);
        }
        .miku-fixed.risen .miku-bubble {
            opacity: 1;
            transform: translateX(-50%) scale(1) translateY(0);
        }

        /* Ground glow when risen */
        .miku-fixed.risen::after {
            content: '';
            position: absolute;
            bottom: 8px; left: 50%;
            transform: translateX(-50%);
            width: 160px; height: 30px;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(255,0,102,0.35) 0%, transparent 70%);
            animation: groundPulse 1s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes groundPulse {
            0%,100% { transform: translateX(-50%) scaleX(1);   opacity: 0.8; }
            50%      { transform: translateX(-50%) scaleX(1.4); opacity: 0.3; }
        }

        /* ═══════════════════════════════
           ALERT OVERLAY
           BUG FIX: was missing entirely —
           that's why it showed on load!
           ═══════════════════════════════ */
        .alert-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,0,64,0.12);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: none;              /* ← THE FIX: hidden by default */
            justify-content: center;
            align-items: center;
        }
        .alert-overlay.show {
            display: flex;
            animation: flashIn 0.4s ease;
        }
        @keyframes flashIn { from{opacity:0} to{opacity:1} }

        .alert-box {
            background: linear-gradient(135deg, #0d1117, #16213e);
            border: 2px solid var(--pink);
            padding: 36px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255,0,102,0.4);
            max-width: 360px;
            width: 90%;
        }
        .alert-box h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--pink);
            font-size: 1.4em;
            margin-bottom: 10px;
        }
        .alert-box p {
            color: #ccc;
            font-size: 0.88em;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .control-btn {
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            border: none; color: #0d1117;
            padding: 10px 22px; border-radius: 18px;
            cursor: pointer; font-family: 'Orbitron', sans-serif;
            font-weight: 700; font-size: 0.78em;
            letter-spacing: 1px; text-transform: uppercase;
            transition: all 0.22s;
        }
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px var(--teal-glow);
        }
    </style>
</head>
<body>

<!-- Dashboard (hidden in Electron mode) -->
<div class="page-wrap"></div>

<!-- Miku -->
<div class="miku-fixed" id="mikuAssistant">
    <div class="miku-bubble" id="mikuBubble">Put that phone away! ❌📱</div>
    <div class="miku-3d-wrap" id="miku3d-container"></div>
</div>

<!-- Alert — display:none by default, .show makes it flex -->
<div class="alert-overlay" id="alertOverlay">
    <div class="alert-box">
        <h2>⚠️ PHONE DETECTED!</h2>
        <p>Miku says: "Put that phone away and study!<br>I believe in you!"</p>
        <button class="control-btn" onclick="dismissAlert()">Gomen, Miku! 🙏</button>
    </div>
</div>

<script>
    const { ipcRenderer } = require('electron');

    // ═══════════════════════════════
    // STATE
    // ═══════════════════════════════
    let model = null;
    let video  = document.createElement('video');
    let canvas = document.createElement('canvas');
    let ctx    = canvas.getContext('2d');
    let isMonitoring  = false;
    let lastPhoneTime = 0;
    let studyScore    = 100;
    let confidenceThreshold = 0.5;
    let mikuIsRisen   = false;
    let alertShowing  = false;
    let hideTimer     = null;

    const PHRASES = [
        "Put that phone away! Let's study! 📱❌",
        "No phones! You got this! 💪",
        "Eyes on your books! 📚",
        "Miku is watching! Stay focused! 👀✨",
        "Phone. Down. NOW! 🎯",
        "Your future self will thank you! ⭐",
    ];

    // ═══════════════════════════════
    // AI MODEL
    // ═══════════════════════════════
    async function init() {
        console.log('[Miku] Loading COCO-SSD model…');
        try {
            model = await cocoSsd.load();
            console.log('[Miku] ✓ Model loaded!');
        } catch(e) {
            console.error('[Miku] ✗ Model load failed:', e);
        }
    }

    // ═══════════════════════════════
    // CAMERA
    // BUG FIX: Electron needs explicit
    // camera permission in main.js —
    // see the fixed main.js file.
    // ═══════════════════════════════
    async function startCamera() {
        console.log('[Miku] Requesting camera…');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            });
            video.srcObject = stream;
            video.setAttribute('playsinline', true);
            await new Promise(r => { video.onloadedmetadata = r; });
            await video.play();
            isMonitoring = true;

            // Ghost mode on — clicks pass through while monitoring
            ipcRenderer.send('set-ignore-mouse', true);

            console.log('[Miku] ✓ Camera active, scanning…');
            detectLoop();
        } catch(err) {
            console.error('[Miku] ✗ Camera error:', err.name, err.message);
        }
    }

    // ═══════════════════════════════
    // DETECTION LOOP
    // ═══════════════════════════════
    async function detectLoop() {
        if (!isMonitoring) return;

        canvas.width  = video.videoWidth  || 640;
        canvas.height = video.videoHeight || 480;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (model && video.readyState >= 2) {
            try {
                const preds = await model.detect(canvas);
                const phoneFound = preds.some(p =>
                    ['cell phone', 'mobile phone', 'phone'].includes(p.class) &&
                    p.score > confidenceThreshold
                );
                phoneFound ? onPhone() : onClear();
            } catch(e) { /* silent */ }
        }

        requestAnimationFrame(detectLoop);
    }

    // ═══════════════════════════════
    // MIKU RISE / DOCK
    // ═══════════════════════════════
    function riseMiku(msg) {
        document.getElementById('mikuBubble').textContent =
            msg || PHRASES[Math.floor(Math.random() * PHRASES.length)];
        document.getElementById('mikuAssistant').classList.add('risen');
        mikuIsRisen = true;
    }

    function dockMiku() {
        document.getElementById('mikuAssistant').classList.remove('risen');
        mikuIsRisen = false;
    }

    // ═══════════════════════════════
    // PHONE DETECTED
    // ═══════════════════════════════
    function onPhone() {
        const now = Date.now();
        if (now - lastPhoneTime < 2500) return;
        lastPhoneTime = now;

        studyScore = Math.max(0, studyScore - 5);
        riseMiku();

        // Cancel any pending dock timer
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }

        // Show alert when score gets low — only once
        if (studyScore <= 70 && !alertShowing) {
            alertShowing = true;
            setTimeout(() => {
                document.getElementById('alertOverlay').classList.add('show');
                // Let user click the button
                ipcRenderer.send('set-ignore-mouse', false);
            }, 700);
        }
    }

    // ═══════════════════════════════
    // PHONE GONE
    // ═══════════════════════════════
    function onClear() {
        // If the alert was up when phone disappeared, auto-dismiss
        if (alertShowing) {
            alertShowing = false;
            document.getElementById('alertOverlay').classList.remove('show');
            ipcRenderer.send('set-ignore-mouse', true);
            studyScore = 100;
            riseMiku('Good job! Keep it up! ✨');
        }

        // Dock Miku after a delay
        if (mikuIsRisen && !hideTimer) {
            hideTimer = setTimeout(() => {
                dockMiku();
                hideTimer = null;
            }, 3000);
        }
    }

    // ═══════════════════════════════
    // DISMISS ALERT BUTTON
    // BUG FIX: was defined TWICE —
    // JS used the last one which had
    // the ghost-mode logic but the
    // first one was also called first.
    // Now there is exactly ONE.
    // ═══════════════════════════════
    function dismissAlert() {
        document.getElementById('alertOverlay').classList.remove('show');
        ipcRenderer.send('set-ignore-mouse', true);  // back to ghost mode
        alertShowing = false;
        studyScore = Math.min(100, studyScore + 15);

        riseMiku('Thank you! Now let\'s focus! 💪✨');
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
            dockMiku();
            hideTimer = null;
        }, 5000);
    }

    // ═══════════════════════════════
    // THREE.JS 3D MODEL
    // ═══════════════════════════════
    function initMiku3D() {
        const container = document.getElementById('miku3d-container');

        const scene    = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(
            45, container.clientWidth / container.clientHeight, 0.1, 1000
        );
        camera.position.set(0, 1.5, 10);

        scene.add(new THREE.AmbientLight(0xffffff, 2.5));
        const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
        hemi.position.set(0, 20, 0);
        scene.add(hemi);
        const dir = new THREE.DirectionalLight(0x39C5BB, 1);
        dir.position.set(2, 2, 2);
        scene.add(dir);

        let mikuModel = null;
        const loader  = new THREE.GLTFLoader();

        loader.load('miku_chibi.glb',
            gltf => {
                mikuModel = gltf.scene;
                mikuModel.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.metalness  = 0;
                        child.castShadow    = false;
                        child.receiveShadow = false;
                    }
                });
                mikuModel.scale.set(0.02, 0.02, 0.02);
                mikuModel.position.set(0, -1.5, 0);
                scene.add(mikuModel);
                console.log('[Miku] ✓ 3D model loaded!');
            },
            undefined,
            err => console.error('[Miku] ✗ GLB load error:', err)
        );

        (function animate() {
            requestAnimationFrame(animate);
            if (mikuModel) mikuModel.rotation.y += mikuIsRisen ? 0.015 : 0.005;
            renderer.render(scene, camera);
        })();
    }

    // ═══════════════════════════════
    // BOOT
    // ═══════════════════════════════
    window.addEventListener('load', async () => {
        initMiku3D();
        await init();      // load AI model
        await startCamera(); // start webcam
    });
</script>
</body>
</html>
